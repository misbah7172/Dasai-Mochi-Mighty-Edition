name: dasai_mochi
description: "Dasai Mochi - Smart Cute Assistant App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI and Animations
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  animated_text_kit: ^4.2.2
  flutter_staggered_animations: ^1.1.1
  
  # Bluetooth Low Energy
  flutter_blue_plus: ^1.36.8
  
  # Voice Recognition
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  shared_preferences: ^2.2.2
  
  # Notifications
  flutter_local_notifications: ^17.2.1+2
  awesome_notifications: ^0.10.1
  
  # HTTP and Weather
  http: ^1.2.1
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  
  # Date and Time
  intl: ^0.20.2
  timezone: ^0.9.2
  
  # State Management
  provider: ^6.1.2
  get: ^4.6.6
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # Utilities
  uuid: ^4.4.0
  path_provider: ^2.1.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - .env

# Launcher icon configuration - use apk-icon.jpg for generating app icons
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/apk-icon.jpg"
